<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OMNIKiosk</title>
<style>
:root{--brand:#e4572e;--bg:#f6f3ef;--card:#fff;--ink:#1d1b19;--mute:#7a736c;--line:#e7e1da;--ok:#1f9d55;--bad:#d33;--fs:1;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(16px*var(--fs))}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
.btn{min-height:56px;padding:0 24px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:1.1em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:#2b2724}
.btn.ok{background:var(--ok)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.big{min-height:84px;font-size:1.5em;border-radius:22px;padding:0 40px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar .logo{font-weight:800;font-size:1.3em;color:var(--brand);flex:0 0 auto}
.bar .sp{flex:1}
.search{flex:1 1 150px;min-width:0;max-width:520px;color:var(--ink);height:48px;border:2px solid var(--line);border-radius:24px;padding:0 18px;background:#fff}
.chip{height:44px;padding:0 16px;border-radius:22px;background:#fff;border:2px solid var(--line);font-weight:600;display:inline-flex;align-items:center}
#offline{background:#b45309;color:#fff;text-align:center;padding:6px;font-weight:600}
/* home */
#home{align-items:center;justify-content:center;text-align:center;padding:24px;gap:22px;background:linear-gradient(160deg,var(--brand),#2b2724)}
#home h1{margin:0;color:#fff;font-size:calc(3em);line-height:1.1}
#home p{margin:0;color:#ffffffcc;font-size:1.4em}
#home .modes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#home .modes .btn{background:#fff;color:#1d1b19;min-width:min(520px,86%)}
html.dark #home .modes .btn:not(.primary){background:#fff;color:#1d1b19}
#home .modes{flex-direction:column;align-items:center;width:100%}
#home .tools{position:absolute;right:16px;top:14px;display:flex;gap:8px;z-index:2}#home .tools .lang{position:static;min-width:56px;justify-content:center}
#home .modes .btn.primary{background:var(--brand);color:#fff!important;box-shadow:0 0 0 4px #fff}
#feat{display:flex;gap:14px;overflow:hidden;max-width:100%;margin-top:6px}
#feat .f{background:#ffffff22;color:#fff;border-radius:16px;padding:10px 16px;font-weight:600;white-space:nowrap}
#home .tiny{position:absolute;left:0;top:0;width:90px;height:90px}
/* order */
#order .body{flex:1;min-height:0;display:flex}
.cats{width:170px;flex:0 0 auto;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:8px}
.cat{width:100%;text-align:left;padding:16px 14px;border-radius:14px;font-weight:700;margin-bottom:6px;line-height:1.2}
.cat.on{background:var(--brand);color:#fff}
.grid{flex:1;min-width:0;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-content:start}
.p{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;box-shadow:0 1px 3px #0001;position:relative}
.p:active{transform:scale(.97)}
.p .img{aspect-ratio:4/3;background:#eee center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4em;font-weight:800;color:#fff}
.p .txt{display:flex;flex-direction:column}
.p .nm{padding:10px 12px 2px;font-weight:700;line-height:1.2;min-height:2.6em}
.p .pr{padding:0 12px 12px;color:var(--brand);font-weight:800;font-size:1.15em}
.p .tag{position:absolute;top:8px;left:8px;background:#fff;border-radius:10px;padding:2px 8px;font-size:.8em;font-weight:700}
.p .inc{position:absolute;right:8px;top:8px;background:var(--brand);color:#fff;border-radius:12px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 8px}
.p.out{opacity:.5;pointer-events:none}
.cart{width:340px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.lines{flex:1;overflow-y:auto;padding:6px 12px}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.ln .i{flex:1;min-width:0}.ln .i b{display:block;line-height:1.2}.ln .i small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:1.3em;font-weight:800}
.qty span{min-width:26px;text-align:center;font-weight:800}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.tot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot .row{display:flex;justify-content:space-between;font-weight:800;font-size:1.3em}
.lang{height:44px;min-width:64px;padding:0 14px;border-radius:22px;background:#fff;border:2px solid var(--line);font-weight:800;display:inline-flex;align-items:center;gap:6px}
#home .lang{position:absolute;right:16px;top:14px;background:#ffffff26;border-color:#ffffff66;color:#fff}
#home{position:relative}
.p .add{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-size:1.5em;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0003}
.cart .grab{display:none}
#mini{display:none}
.ln .x{color:var(--bad);font-size:1.2em;width:36px;height:36px}
/* short / landscape phone: keep cart on the side, compact horizontal product cards */
@media (max-height:560px) and (orientation:landscape){
 .bar{padding:6px 12px}.chip,.lang{height:38px}.search{height:38px}.bar .logo{display:none}
 .cats{width:120px;padding:6px}.cat{padding:10px 8px;font-size:.88em;margin-bottom:4px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:8px}
 .p{flex-direction:row;align-items:center;min-height:72px}
 .p .img{width:72px;height:72px;aspect-ratio:1;font-size:1.6em;flex:0 0 auto}
 .p .nm{padding:6px 8px 0;min-height:0;font-size:.95em;flex:1}.p .pr{padding:0 8px 6px;font-size:1em}
 .p .txt{flex:1;min-width:0;padding-right:48px}.p .add{width:34px;height:34px;bottom:auto;top:50%;margin-top:-17px}
 .cart{width:250px}.cart h3{padding:8px 12px;font-size:1em}.tot{padding:8px 12px;gap:6px}.tot .row{font-size:1.1em}
 #co{min-height:46px!important;font-size:1em!important}
 #home h1{font-size:2em}#home p{font-size:1.1em}#home{gap:12px}.btn.big{min-height:60px;font-size:1.2em;padding:0 26px}
 .pcard{padding:12px}.pcard .img{width:110px;height:110px}.pcard .big{font-size:2.4em}
 #done{gap:6px;overflow-y:auto;padding:10px}#done .no{font-size:4em}
 .md{max-height:96%}
}
html.dark{--bg:#15130f;--card:#25221e;--ink:#f3efe9;--mute:#a59d93;--line:#3b3631}
html.dark .opt,html.dark .search,html.dark .chip,html.dark .btn.ghost,html.dark .field input,html.dark .field textarea,html.dark .lang,html.dark .p,html.dark #q .n{background:var(--card);color:var(--ink)}
html.dark .qty button,html.dark .pin button{background:#352f2a}
#clk{font-weight:700;opacity:.9}
.th{width:44px;height:44px;border-radius:10px;background:#eee center/cover;flex:0 0 auto;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.err{color:var(--bad);font-weight:700;min-height:1.3em;margin-top:6px}.chk{display:flex;gap:10px;align-items:center;font-weight:600}.chk input{width:26px;height:26px}
#pager,#stepbar{display:none}
html.pv #stepbar{display:flex;justify-content:center;gap:6px;padding:8px 10px;background:linear-gradient(90deg,#1f1b16,#3d2b22);color:#fff;font-size:.8em;font-weight:700}
#stepbar span{display:flex;align-items:center;gap:6px;opacity:.55;padding:4px 10px;border-radius:999px}#stepbar span.on{opacity:1;background:var(--brand)}#stepbar span.dn{opacity:.9}
#stepbar b{width:20px;height:20px;border-radius:50%;background:#fff;color:#222;display:inline-flex;align-items:center;justify-content:center;font-size:.9em}
html.pv .body{flex-direction:column;padding-bottom:84px}
html.pv .cats{width:auto;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:8px;flex:0 0 auto}
html.pv .cat{width:auto;white-space:nowrap;margin:0;padding:12px 20px;border-radius:999px;background:var(--bg);border:2px solid var(--line)}html.pv .cat.on{border-color:var(--brand);background:var(--brand)}
html.pv .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;overflow:hidden;gap:12px;padding:12px;align-content:stretch}
html.pv .p{flex-direction:column;align-items:stretch;min-height:0}
html.pv .p .img{width:100%;height:auto;aspect-ratio:auto;flex:1 1 auto;min-height:0;font-size:2.6em}
html.pv .p .txt{padding-right:0}html.pv .p .nm{min-height:0;font-size:1.05em}html.pv .p .add{bottom:10px;top:auto;margin:0;width:46px;height:46px;right:10px}
html.pv #pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px;flex:0 0 auto}
#pager .dots{display:flex;gap:6px}#pager .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}#pager .dots i.on{background:var(--brand);width:22px;border-radius:5px}#pager .pgn{font-weight:700;color:var(--mute)}
html.pv .cart{display:none;position:fixed;inset:0;width:auto;z-index:8;border:0}html.pv .cart.open{display:flex}
html.pv .cart .grab{display:block;padding:16px;font-weight:800;color:var(--brand);background:var(--card);border-bottom:1px solid var(--line)}
html.pv #mini{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:#1f1b16;color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;font-weight:800;font-size:1.05em;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px #0004}
html.pv #mini::after{content:attr(data-go);background:var(--brand);padding:12px 20px;border-radius:14px}
html.pv #home{padding:24px}
.p .imgw{position:relative;display:flex;flex:1 1 auto;min-height:0}.p .imgw .img{width:100%}
.p .tag{top:8px;left:8px;max-width:62%;z-index:1}.p .inc{top:8px;right:8px;left:auto;z-index:1}
.p .txt{flex:0 0 auto;padding:0}.p .nm{padding:10px 12px 2px;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.p .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px 12px}
.p .row .pr{padding:0;min-width:0}
html .p .row .add{position:static;width:44px;height:44px;margin:0;flex:0 0 auto;font-size:1.6em;line-height:1}
.ln{display:grid;grid-template-columns:48px 1fr auto;gap:6px 10px;align-items:start}
.th{width:48px;height:48px}.ln .th{grid-row:1/3}.ln .i{grid-column:2;grid-row:1}.ln .x{grid-column:3;grid-row:1;justify-self:end}
.ln .qty{grid-column:2;grid-row:2}.ln .lt{grid-column:3;grid-row:2;align-self:center;font-weight:800;white-space:nowrap}
.bar{flex-wrap:nowrap}.bar .search{min-width:0;flex:1}.chip,.btn{white-space:nowrap}
html.pv #toast{bottom:auto;top:10px}
html.pv .bar .logo{display:none}
html.pv .bar{gap:8px;padding:8px 10px}html.pv .bar .search{height:42px}html.pv .bar .chip{padding:0 12px}
@media (max-height:560px) and (orientation:landscape){.p .imgw{flex:0 0 72px;width:72px;height:72px}.p .imgw .img{height:100%}.p .txt{flex:1;min-width:0;padding:0}.p .nm{padding:6px 8px 0;font-size:.95em}.p .row{padding:2px 8px 8px}.p .row .pr{font-size:1em}html .p .row .add{width:36px;height:36px}.p .tag{top:2px;left:2px;font-size:.65em;padding:1px 5px}.p .inc{top:2px;right:2px;min-width:22px;height:22px;font-size:.8em}.cart{width:276px}.cart .lines{overflow-x:hidden}.qty{gap:4px}.qty button{width:34px;height:34px;font-size:1.1em}.qty span{min-width:22px}.ln{gap:4px 8px;grid-template-columns:44px 1fr auto}.th{width:44px;height:44px}}
/* modal */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:var(--card);border-radius:24px;width:min(640px,100%);max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.md header{padding:18px 20px;font-weight:800;font-size:1.3em;border-bottom:1px solid var(--line)}
.md .c{padding:16px 20px;overflow-y:auto;flex:1}
.md footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end;align-items:center}
.grp{margin-bottom:18px}.grp h4{margin:0 0 8px}.grp h4 em{color:var(--bad);font-style:normal;font-size:.8em;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{padding:12px 18px;border-radius:14px;border:2px solid var(--line);font-weight:700;background:#fff}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,#fff);color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input,.field textarea{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.seg{display:flex;gap:10px;flex-wrap:wrap}
/* success */
#done{align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
#done .no{font-size:7em;font-weight:900;color:var(--brand);line-height:1}
/* price check */
#pc .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pcard{background:var(--card);border-radius:24px;padding:24px;width:min(720px,100%);display:flex;gap:22px;align-items:center;box-shadow:0 2px 8px #0001}
.pcard .img{width:200px;height:200px;border-radius:18px;background:#eee center/cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:4em;color:#fff;font-weight:800}
.pcard .big{font-size:clamp(1.8em,9vw,3.4em);font-weight:900;color:var(--brand);line-height:1.1;overflow-wrap:anywhere}
.pcard{max-width:100%;min-width:0;overflow:hidden}.pcard>div{min-width:0}
.pcard .img{max-width:42%;height:auto;aspect-ratio:1}
.pcard.li{padding:12px;gap:12px;width:100%}.pcard.li .img{width:84px;max-width:84px;font-size:2em;border-radius:14px}
.pcard.li .nm{font-weight:800;font-size:1.15em;line-height:1.2;overflow-wrap:anywhere}
.pcard.li .big{font-size:clamp(1.3em,6.5vw,2em)}
.pcard .go{flex:0 0 auto;width:52px;min-width:52px;min-height:52px;padding:0;font-size:1.6em}
#pc .body{overflow-x:hidden}#pcr{max-width:760px;margin:0 auto}
@media (max-width:640px){.pcard.det{flex-direction:column;text-align:center;padding:18px}.pcard.det .img{width:min(60%,240px);max-width:none}}
html.pv .pcard.det{flex-direction:column;text-align:center;padding:18px}html.pv .pcard.det .img{width:min(60%,240px);max-width:none}
.hint{color:var(--mute);text-align:center;font-size:1.2em;padding:30px}
/* queue */
#q .cols{flex:1;display:flex;gap:0}
#q .col{flex:1;padding:20px;text-align:center}
#q .col h2{margin:0 0 16px;font-size:2.2em}
#q .col.r{background:#e6f6ec}#q .col.p{background:#fff5e6}
#q .nums{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
#q .n{font-size:4em;font-weight:900;background:#fff;border-radius:20px;padding:6px 26px;box-shadow:0 2px 6px #0002}
/* toast / pin / idle */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:14px 22px;border-radius:14px;z-index:99;font-weight:600;max-width:90%;text-align:center}
.pin{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin-top:10px}
.pin button{height:68px;border-radius:16px;background:var(--bg);font-size:1.6em;font-weight:800}
.dots{text-align:center;font-size:2em;letter-spacing:10px;min-height:1.4em}
.spin{width:44px;height:44px;border:5px solid #ddd;border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
html.pv .bar .lang .ln{display:none}html.pv .bar .lang{min-width:44px;padding:0 12px;justify-content:center}
html.pv .bar .search{flex:1 1 110px;min-width:110px;font-size:.95em}html.pv .bar .chip{padding:0 12px}html.pv .bar .sp{display:none}
html.pv .p .row{flex-wrap:wrap;row-gap:2px}html.pv .p .row .pr{font-size:.95em;white-space:nowrap}
html.pv .p .nm{-webkit-line-clamp:3;font-size:1em}
html.pv .p .row .add{width:40px;height:40px}
</style>
</head>

<div id="toast" class="hide"></div>

let TOKEN=null;const pend={};let rid=1;
window.__kioskResp=function(id,status,text){const p=pend[id];if(!p)return;delete pend[id];p({status,text})};
window.__kioskRespB64=function(id,status,b64){let text='';try{const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);text=new TextDecoder('utf-8').decode(u)}catch(e){}window.__kioskResp(id,status,text)};
function rawReq(method,path,body,auth){
  const url=S.server.replace(/\/+$/,'')+path;
  const headers={'Content-Type':'application/json'};if(auth&&TOKEN)headers.Authorization='Bearer '+TOKEN;
  const bs=body==null?null:JSON.stringify(body);
  if(NATIVE){return new Promise(res=>{const id=rid++;pend[id]=res;setTimeout(()=>{if(pend[id]){delete pend[id];res({status:0,text:''})}},20000);NATIVE.request(id,method,url,JSON.stringify(headers),bs)})}
  return fetch(url,{method,headers,body:bs}).then(r=>r.text().then(text=>({status:r.status,text}))).catch(()=>({status:0,text:''}));
}
let AUTH_BLOCK=0,credBad=false;
async function login(force){
  if(!force&&(credBad||Date.now()<AUTH_BLOCK))return {ok:false,status:429,message:lastErr||L('Naka-pause ang login — i-check ang username/password sa Admin > Server.','Login paused — check the username/password in Admin > Server.')};
  const r=await rawReq('POST','/api/auth/login',{username:S.user,password:S.pass},false);
  let j={};try{j=JSON.parse(r.text)}catch(e){}
  if(r.status===200&&j.token){TOKEN=j.token;credBad=false;AUTH_BLOCK=0;return {ok:true}}
  if(r.status===429||/too many/i.test(j.message||'')){const m=/in (\d+) second/.exec(j.message||'');AUTH_BLOCK=Date.now()+((m?+m[1]:30)+3)*1000}
  else if(r.status===401||r.status===403||r.status===400)credBad=true;
  return {ok:false,status:r.status,message:j.message||(r.status===0?t('noserver'):t('nologin')),otp:!!(j.otpRequired||j.requiresOtp)};
}
async function api(method,path,body){
  if(!TOKEN){const l=await login();if(!l.ok)return {ok:false,status:l.status||0,data:{message:l.message}}}
  let r=await rawReq(method,path,body,true);
  if(r.status===401){const l=await login();if(!l.ok)return {ok:false,status:401,data:{message:l.message}};r=await rawReq(method,path,body,true)}
  let j={};try{j=JSON.parse(r.text)}catch(e){}
  noteLock(path,r.status,j);
  return {ok:r.status>=200&&r.status<300&&j.success!==false,status:r.status,data:j};
}
/* ---------- license lock (Self-Order Kiosk subscription) ----------
   The OMNIPOS server answers HTTP 402 {featureLocked:true} on every /api/kiosk/* call while the subscription is not active.
   That is not an outage: show the "unavailable" screen (never the cached catalog) and keep re-checking until it is active again. */
let LOCKED=null;
function noteLock(path,status,j){
  if(!/^\/api\/kiosk\//.test(path))return;
  if(status===402&&j&&j.featureLocked){const was=!!LOCKED;LOCKED=j;if(!was)setTimeout(onLockChange,0)}
  else if(LOCKED&&status>=200&&status<300&&j&&j.success!==false){LOCKED=null;setTimeout(onLockChange,0)}
}
function onLockChange(){
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  if(typeof warnEl!=='undefined'&&warnEl){warnEl=null}
  if(LOCKED){cart=[];rLocked()}else go('home');
}

    const chunk=need.slice(i,i+10);chunk.forEach(c=>IMGREQ.add(c));

    if(k==='extra')h=`${r.askAppt?`<div class="field"><label>${esc(L('Appointment','Appointment'))}</label><div class="rowx"><input type="date" data-f="appt" min="${new Date().toISOString().slice(0,10)}" value="${esc(st.appt)}"><input type="time" data-f="apptTime" value="${esc(st.apptTime)}"></div></div>`:''}${r.askRef?`<div class="field"><label>${esc(L('Detalye ng item (hal. bag ng labada, modelo ng phone)','Item details (e.g. laundry bag, phone model)'))}</label><input data-f="ref" maxlength="50" value="${esc(st.ref)}"></div>`:''}${r.rxNotice?`<label class="chk field"><input type="checkbox" data-f="rx" ${st.rx?'checked':''}> ${esc(L('Magdadala ako ng reseta para sa gamot na kailangan nito.','I will bring a prescription for medicines that require one.'))}</label>`:''}${needAdult()?`<label class="chk field"><input type="checkbox" data-f="adult" ${st.adult?'checked':''}> ${esc(L('Ako ay 18 taong gulang pataas (ipapakita ang ID sa counter).','I am 18 or older (ID will be checked at the counter).'))}</label>`:''}${r.askPay?`<div class="field"><label>${esc(L('Paano magbabayad?','How will you pay?'))}</label>${sel('pay',[['Cash',L('Cash','Cash')],['GCash','GCash'],['Maya','Maya'],['Card','Card']])}</div>`:''}
      ${r.askPickup?`<div class="field"><label>${esc(L('Kailan kukunin?','Pickup time'))}</label>${sel('pickup',[['ASAP',L('Ngayon na','ASAP')],['+15m','+15 min'],['+30m','+30 min'],['+60m','+1 hr']])}</div>`:''}
      ${r.askDisc?`<div class="field"><label>${esc(L('May discount ba? (kailangan ng ID sa counter)','Discount? (ID required at counter)'))}</label>${sel('disc',[['',L('Wala','None')],['Senior','Senior'],['PWD','PWD']])}${st.disc?`<input data-f="discId" placeholder="ID no." value="${esc(st.discId)}" style="margin-top:8px">`:''}</div>`:''}
      ${r.askAllergy?`<div class="field"><label>${esc(L('Allergy / special request','Allergy / special request'))}</label><input data-f="allergy" maxlength="60" value="${esc(st.allergy)}"></div>`:''}
      ${CFG.orderNote?`<div class="field"><label>${esc(t('note'))}</label><textarea data-f="note" rows="2" maxlength="80">${esc(st.note)}</textarea></div>`:''}`;
    if(k==='review')h=`<div style="font-weight:700;margin-bottom:8px">${types.length>1?esc(st.type):''}${st.table?' · '+esc(t('table'))+' '+esc(st.table):''}${st.name?' · '+esc(st.name):''}</div>`+cart.map(l=>`<div class="rowx" style="justify-content:space-between;padding:4px 0"><span>${l.qty}× ${esc(l.name)}${l.unit?` (${esc(l.unit)})`:''}${l.options.length?` <small style="color:var(--mute)">(${esc(l.options.map(o=>o.name).join(', '))})</small>`:''}</span><b>${money(lineTotal(l))}</b></div>`).join('')+(st.disc?`<div style="color:var(--mute);margin-top:6px">${esc(st.disc)} ID: ${esc(st.discId)} — ${esc(L('i-verify sa counter','verified at counter'))}</div>`:'')+(r.terms?`<label class="chk" style="margin-top:12px"><input type="checkbox" data-f="agree" ${st.agree?'checked':''}> ${esc(L('Sumasang-ayon ako na magbayad sa counter at tama ang order ko.','I agree to pay at the counter and my order is correct.'))}</label>`:'');
    box.innerHTML=`<header>${esc(t('checkout'))} · ${money(cartTotal())}</header><div class="c"><div class="steps">${S2.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>${h}<div class="err" id="er"></div></div><footer><button class="btn ghost" id="x">${esc(idx?t('back'):t('cancel'))}</button><button class="btn ${last?'ok big':''}" id="go" style="min-height:60px">${esc(last?t('place'):L('Susunod →','Next →'))}</button></footer>`;
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{tidy();st[b.dataset.s]=b.dataset.v;if(b.dataset.s==='disc'&&!b.dataset.v)st.discId='';paint()});
    $('#x',box).onclick=()=>{tidy();if(idx>0){idx--;paint()}else m.close()};
    $('#go',box).onclick=()=>{tidy();const e=check(k);if(e){$('#er',box).textContent=e;return}if(last)submit($('#go',box));else{idx++;paint()}};
  }
  paint();
}
function showDone(o,total){
  view='done';
  app.innerHTML=`<div class="screen" id="done"><div style="font-size:3em">✅</div><h2 style="margin:0">${esc(t('thanks'))}</h2>
   <div>${esc(t('yours'))}</div><div class="no">${esc(o.orderNo)}</div>
   <div style="font-size:1.3em;font-weight:700">${esc(o.orderType)} · ${money(total)}</div>${o.appt?`<div style="font-size:1.3em;font-weight:700">📅 ${esc(o.appt)}</div>`:''}
   <div id="qr"></div><p style="max-width:520px;color:var(--mute);font-size:1.15em">${esc(t('pay'))}</p>
   <button class="btn big" id="nw">${esc(t('newo'))}</button><button class="lang" id="lg">🌐 ${esc(t('lang'))}</button></div>`;
  try{new QRCode($('#qr'),{text:o.id,width:150,height:150})}catch(e){}
  $('#nw').onclick=()=>go('home');$('#lg').onclick=()=>{S.lang=LANG==='tl'?'en':'tl';LANG=S.lang;saveSettings(S);showDone(o,total)};
  clearTimeout(showDone.t);showDone.t=setTimeout(()=>{if(view==='done')go('home')},25000);
}

/* ---------- price check ---------- */
let pcShown=null;
function rPC(){
  app.innerHTML=`<div class="screen" id="pc">${topBar(t('pc'),`<input class="search" id="pq" placeholder="${esc(t('search'))}" autocomplete="off">`)}
   <div class="body"><div id="pcr" class="hint">📷 ${esc(t('scan'))}</div></div></div>`;
  $('#lg').onclick=toggleLang;$('#bk').onclick=()=>go('home');
  const pq=$('#pq');pq.oninput=()=>{const q=pq.value.trim().toLowerCase();if(!q){$('#pcr').className='hint';$('#pcr').innerHTML='📷 '+esc(t('scan'));return}
    const rank=p=>{const n=p.name.toLowerCase();if(String(p.code).toLowerCase()===q)return 0;if(n.startsWith(q))return 1;if(n.split(/\s+/).some(w=>w.startsWith(q)))return 2;if(n.includes(q))return 3;if(String(p.category||'').toLowerCase().includes(q))return 4;return 9};
    const list=CAT.products.map(p=>[rank(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).map(x=>x[1]).slice(0,12);
    $('#pcr').className='';$('#pcr').style.width='100%';$('#pcr').innerHTML=list.length?list.map(p=>`<div style="margin-bottom:12px"><div class="pcard li">${imgDiv(p,'img')}<div style="flex:1;min-width:0"><div class="nm">${esc(p.name)}</div><div class="big">${money(p.price)}</div>${p.inStock?'':`<div style="color:var(--bad);font-weight:700">${esc(t('oos'))}</div>`}</div><button class="btn ghost go" data-sh="${esc(p.code)}" aria-label="${esc(p.name)}">›</button></div></div>`).join(''):`<div class="hint">${esc(t('nf'))}</div>`;
    fetchImages(list.map(p=>p.code));paintImages();$('#pcr').querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>showPC(prod(b.dataset.sh)))};
}
function showPC(p,level){
  if(!p){$('#pcr').className='hint';$('#pcr').textContent='❌ '+t('nf');return}
  $('#pcr').className='';$('#pcr').style.width='100%';
  $('#pcr').innerHTML=`<div style="display:flex;justify-content:center"><div class="pcard det">${imgDiv(p,'img')}<div style="flex:1;min-width:0"><div style="font-size:1.6em;font-weight:800;line-height:1.2">${esc(p.name)}</div>
   <div style="color:var(--mute)">${esc(p.category)}${level?' · '+esc(level):''}</div><div class="big">${money(p.price)}${p.baseUnit?`<small style="font-size:.35em;color:var(--mute)"> /${esc(p.baseUnit)}</small>`:''}</div>
   ${p.uom.map(u=>`<div style="font-weight:600">${esc(u.name)}: ${money(u.fixedPrice>0?u.fixedPrice:p.price*u.factor)}</div>`).join('')}
   <div style="margin-top:8px;font-weight:700;color:${p.inStock?'var(--ok)':'var(--bad)'}">${p.inStock?(CFG.showStock?p.stock+' '+esc(t('left')):'✔ '+esc(t('inst'))):esc(t('oos'))}</div></div></div></div>`;
  fetchImages([p.code]);paintImages();
  clearTimeout(showPC.t);showPC.t=setTimeout(()=>{if(view==='pc'){$('#pcr').className='hint';$('#pcr').innerHTML='📷 '+esc(t('scan'))}},20000);
}
async function scanned(code){
  lastAct=Date.now();['sq','pq'].forEach(id=>{const e=document.getElementById(id);if(e){e.value='';if(id==='sq')query=''}});if(view==='order')renderGrid();
  if(view==='pc'){const r=await api('GET','/api/kiosk/lookup?code='+encodeURIComponent(code));if(r.ok)showPC(r.data.product,r.data.product.priceLevel);else showPC(null)}
  else if(view==='order'){const r=await api('GET','/api/kiosk/lookup?code='+encodeURIComponent(code));
    if(r.ok){const p=prod(r.data.product.code)||r.data.product;if(addLine(p))toast('✓ '+p.name,1200)}else toast(t('nf'))}
}
let kb='',kbT=0;
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')&&!e.target.dataset.scan&&e.target.id!=='pq'&&e.target.id!=='sq')return;
  const now=Date.now();if(now-kbT>80)kb='';kbT=now;
  if(e.key==='Enter'){if(kb.length>=3){const c=kb;kb='';scanned(c);e.preventDefault()}kb=''}
  else if(e.key.length===1)kb+=e.key;
},true);

/* ---------- queue board ---------- */
let qTimer=null;
function rQ(){
  app.innerHTML=`<div class="screen" id="q">${topBar(t('q'))}<div class="cols"><div class="col p"><h2>${(BICON[BIZ()]||['🍳'])[0]} ${esc(t('prep'))}</h2><div class="nums" id="qp"></div></div><div class="col r"><h2>✅ ${esc(t('ready'))}</h2><div class="nums" id="qr"></div></div></div></div>`;
  $('#lg').onclick=toggleLang;$('#bk').onclick=()=>{clearInterval(qTimer);go('home')};
  const poll=async()=>{if(view!=='q'){clearInterval(qTimer);return}const r=await api('GET','/api/kiosk/queue');if(r.ok){$('#qp').innerHTML=r.data.preparing.map(n=>`<div class="n">${esc(n)}</div>`).join('');$('#qr').innerHTML=r.data.ready.map(n=>`<div class="n">${esc(n)}</div>`).join('')}};
  poll();clearInterval(qTimer);qTimer=setInterval(poll,4000);
}

/* ---------- admin: PIN + sheet + setup ---------- */
function pinPrompt(cb){
  let v='';const m=modal('');const box=m.firstChild;
  function paint(){box.innerHTML=`<header>🔒 ${esc(t('pin'))}</header><div class="c"><div class="dots">${'●'.repeat(v.length)}</div><div class="pin">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div><footer><button class="btn ghost" id="pc">${esc(t('cancel'))}</button></footer>`;
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k==='OK'){m.close();const ok=v===(S.pin||'1234');if(!ok)toast('✗');cb(ok);return}else if(v.length<8)v+=k;paint()});
    $('#pc',box).onclick=()=>m.close()}
  paint();
}
function adminSheet(){
  const m=modal(`<header>⚙️ OMNIKiosk · ${esc(S.device)}</header><div class="c" style="display:flex;flex-direction:column;gap:12px">
   <div style="color:var(--mute)">${esc(S.server||'')} · ${online?'🟢 online':'🔴 offline'}</div>
   <button class="btn ghost" id="a6">🌐 ${esc(t('lang'))}</button>
   <button class="btn ghost" id="a7">${S.dark?'☀️':'🌙'} ${esc(L('Dark mode','Dark mode'))}: ${S.dark?t('on'):t('off')}</button>
   <button class="btn ghost" id="a10">🔍 ${esc(L('Auto-hanap ng server','Auto-find server'))}: ${S.autoFind===false?t('off'):t('on')}</button>
   <button class="btn ghost" id="a9">📱 ${esc(L('Oryentasyon','Orientation'))}: ${esc({landscape:L('Pahalang','Horizontal'),portrait:L('Patayo','Vertical'),auto:'Auto'}[S.orient||'landscape'])}</button>
   <button class="btn ghost" id="a8">📋 ${esc(L('Mga rule ng checkout','Checkout rules'))}</button>
   <button class="btn ghost" id="a1">🔄 ${esc(t('refresh'))}</button>
   <button class="btn ghost" id="a2">🔠 ${esc(t('large'))}: ${S.large?t('on'):t('off')}</button>
   <button class="btn ghost" id="a3">🔧 ${esc(t('server'))}</button>
   ${NATIVE?`<button class="btn ghost" id="a5">🔁 ${esc(t('autostart'))}: ${S.autostart===false?t('off'):t('on')}</button><button class="btn dark" id="a4">⏻ ${esc(t('exit'))}</button>`:''}
  </div><footer><button class="btn" id="a0">${esc(t('okb'))}</button></footer>`);
  $('#a0',m).onclick=()=>m.close();
  $('#a1',m).onclick=async()=>{m.close();IMG.clear();IMGREQ.clear();await loadCatalog();toast('✓');go('home')};
  $('#a2',m).onclick=()=>{S.large=!S.large;saveSettings(S);applyTheme();m.close();go(view)};
  $('#a6',m).onclick=()=>{m.close();setLang(LANG==='tl'?'en':'tl')};
  $('#a7',m).onclick=()=>{m.close();toggleDark()};
  $('#a10',m).onclick=()=>{S.autoFind=S.autoFind===false;saveSettings(S);m.close();toast('✓')};
  $('#a9',m).onclick=()=>{const o=S.orient||'landscape';setOrient(o==='landscape'?'portrait':o==='portrait'?'auto':'landscape');m.close();toast('✓')};
  $('#a8',m).onclick=()=>{m.close();rulesEditor()};
  $('#a3',m).onclick=()=>{m.close();setupScreen()};
  if(NATIVE){$('#a4',m).onclick=()=>NATIVE.exitKiosk();$('#a5',m).onclick=()=>{S.autostart=S.autostart===false;saveSettings(S);try{NATIVE.setAutostart(S.autostart!==false)}catch(e){}m.close();adminSheet()}}
}
function rulesEditor(){
  const r=R(),vis=visRules(),b=BIZ();
  const field=d=>{const lb=rdLabel(d);return d[1]==='b'?`<label class="chk field"><input type="checkbox" data-k="${d[0]}" ${r[d[0]]?'checked':''}> ${esc(L(lb[0],lb[1]))}</label>`:`<div class="field"><label>${esc(L(lb[0],lb[1]))}</label><input data-k="${d[0]}" value="${esc(r[d[0]])}" ${d[1]==='n'?'inputmode="decimal"':''}></div>`};
  const bn=PRE[b]?L(PRE[b].t[0],PRE[b].t[1]):L('General (lahat)','General (all)');
  const m=modal(`<header>📋 ${esc(L('Mga rule ng checkout','Checkout rules'))}</header><div class="c"><div style="font-weight:700;margin-bottom:6px">${esc(L('Uri ng negosyo','Business type'))}: ${esc(bn)} 🔒</div><div style="color:var(--mute);margin-bottom:12px;font-size:.9em">${esc(L('Itinakda ng developer ang uri ng negosyo. Ang mga rule sa ibaba ay yung akma lang dito.','The developer sets the business type. Only rules that fit it are shown below.'))}</div>${RD.filter(d=>vis.includes(d[0])).map(field).join('')}</div><footer><button class="btn ghost" id="r0">${esc(t('cancel'))}</button><button class="btn" id="r1">${esc(t('okb'))}</button></footer>`);
  $('#r0',m).onclick=()=>m.close();
  $('#r1',m).onclick=()=>{const o=Object.assign({},S.rules||{});m.querySelectorAll('[data-k]').forEach(e=>{const d=RD.find(x=>x[0]===e.dataset.k);o[e.dataset.k]=d[1]==='b'?e.checked:d[1]==='n'?(parseFloat(e.value)||0):e.value.trim()});S.rules=o;saveSettings(S);m.close();toast('✓')};
}
function setupScreen(msg){
  const m=modal(`<header>${esc(t('setup'))} · <button class="lang" id="s_lg" style="height:34px">🌐 ${esc(t('lang'))}</button></header><div class="c">
   ${msg?`<div style="color:var(--bad);font-weight:700;margin-bottom:10px">${esc(msg)}</div>`:''}
   <div class="field"><label>${esc(t('srv'))}</label><input id="s_srv" value="${esc(S.server||'')}" inputmode="url" autocapitalize="off"><div id="s_found" style="margin-top:8px;font-weight:600"></div><button class="btn ghost" id="s_find" style="margin-top:8px;min-height:44px">🔍 ${esc(L('Hanapin ang OMNIPOS server','Find OMNIPOS server'))}</button></div>
   <div class="field"><label>${esc(t('usr'))}</label><input id="s_usr" value="${esc(S.user||'')}" autocapitalize="off"></div>
   <div class="field"><label>${esc(t('pw'))}</label><input id="s_pw" type="password" value="${esc(S.pass||'')}"></div>
   <div class="field"><label>${esc(t('pinlbl'))}</label><input id="s_pin" inputmode="numeric" value="${esc(S.pin||'')}" maxlength="8"></div>
   <div id="s_msg" style="min-height:1.4em;font-weight:600"></div>
  </div><footer><button class="btn" id="s_ok">${esc(t('connect'))}</button></footer>`);
  $('#s_lg',m).onclick=()=>{S.server=$('#s_srv',m).value;S.user=$('#s_usr',m).value;S.pass=$('#s_pw',m).value;S.pin=$('#s_pin',m).value;LANG=S.lang=LANG==='tl'?'en':'tl';m.close();setupScreen(msg)};
  const runFind=async()=>{const f=$('#s_found',m);f.textContent='⏳ '+L('Naghahanap sa LAN…','Searching the LAN…');const a=await discover();
    if(!a.length){f.textContent='⚠ '+L('Walang nahanap. Siguraduhing nasa parehong WiFi at tumatakbo ang OMNIPOS.','Nothing found. Make sure you are on the same WiFi and OMNIPOS is running.');return}
    const pick=u=>{$('#s_srv',m).value=u;f.textContent='✅ '+L('Nahanap: ','Found: ')+u};
    if(a.length===1)pick(a[0]);else{f.innerHTML=a.map(u=>`<button class="chip" data-u="${esc(u)}" style="margin:2px">${esc(u)}</button>`).join('');f.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u))}};
  $('#s_find',m).onclick=runFind;if(!S.server)setTimeout(runFind,300);
  $('#s_ok',m).onclick=async()=>{
    S.server=$('#s_srv',m).value.trim().replace(/\/+$/,'');if(S.server&&!/^https?:\/\//.test(S.server))S.server='http://'+S.server;
    S.user=$('#s_usr',m).value.trim();S.pass=$('#s_pw',m).value;S.pin=$('#s_pin',m).value.trim()||'1234';
    $('#s_msg',m).textContent=t('connecting');TOKEN=null;credBad=false;AUTH_BLOCK=0;
    const l=await login(true);
    if(!l.ok){$('#s_msg',m).style.color='var(--bad)';$('#s_msg',m).textContent=l.otp?t('otp'):l.message;return}
    const r=await loadCatalog(true);
    if(LOCKED){saveSettings(S);m.close();rLocked();return}
    if(!r.ok&&!CAT){$('#s_msg',m).style.color='var(--bad)';$('#s_msg',m).textContent=(r.data&&r.data.message)||t('nomod');return}
    saveSettings(S);m.close();go('home');
  };
}

/* ---------- idle handling ---------- */
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
let warnEl=null;
setInterval(()=>{
  if(view==='home'||view==='q'||view==='done'||!CFG.idleSeconds)return;
  const idle=(Date.now()-lastAct)/1000,lim=CFG.idleSeconds||60;
  if(idle>lim+10){if(warnEl){warnEl.close();warnEl=null}cart=[];document.querySelectorAll('.ov').forEach(o=>o.remove());go('home')}
  else if(idle>lim&&!warnEl&&(cart.length||view!=='pc')){
    if(!cart.length&&view!=='order'){go('home');return}
    warnEl=modal(`<header>⏱ ${esc(t('stillhere'))}</header><div class="c" style="text-align:center"><div class="spin"></div></div><footer><button class="btn big" id="im">${esc(t('touch'))}</button></footer>`);
    $('#im',warnEl).onclick=()=>{warnEl.close();warnEl=null;lastAct=Date.now()};
  }else if(idle<=lim&&warnEl){warnEl.close();warnEl=null}
},1000);
let tk=0;setInterval(async()=>{ // pana-panahong
  if(credBad||Date.now()<AUTH_BLOCK)return; // huwag nang ulit-ulitin ang maling login (iwas lockout) refresh ng catalog (presyo/stock) habang walang ginagawa sa home
  if(LOCKED){await loadCatalog();return} // locked: re-check every 15s; onLockChange() brings the home screen back once the subscription is active
  if(online&&(++tk%4))return;
  if(view==='home'||view==='pc'){const was=online;await loadCatalog();if(view==='home'&&(was!==online||!online))rHome()}
},15000);

/* ---------- boot ---------- */
(async function boot(){
  app.innerHTML='<div class="spin" style="margin-top:40vh"></div>';
  if(!S.server||!S.user){app.innerHTML='';setupScreen();return}
  const r=await loadCatalog(true);
  if(LOCKED){rLocked();return}
  if(!r.ok&&!CAT){app.innerHTML='';setupScreen((r.data&&r.data.message)||t('noserver'));return}
  go('home');
})();
window.__kiosk={go,get cart(){return cart}}; // para sa testing
})();
</script>
