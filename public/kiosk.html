<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OMNIKiosk</title>
<style>
:root{--brand:#2563eb;--brandh:#1d4ed8;--bg:#f4f7fb;--card:#ffffff;--ink:#1e293b;--mute:#64748b;--line:#e2e8f0;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;--soft:#eff6ff;--alt:#eef2f7;--navy:#0f172a;--fs:1;--r:18px;--backdrop:radial-gradient(circle at 15% 20%,rgba(56,189,248,.07),transparent 40%),radial-gradient(circle at 85% 80%,rgba(168,85,247,.06),transparent 42%),#f4f7fb}
/* Kulay ng OmniPOS: day = #f4f7fb / #2563eb, dark = #121218 / #7c5cff (parehong values sa style.css ng OmniPOS) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(16px*var(--fs))}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
button{max-width:100%;overflow-wrap:anywhere}
/* Ang mga button ay pwedeng mag-wrap sa 2-3 linya (mahaba ang Tagalog) at hindi lalampas sa lapad ng screen */
.btn{min-height:56px;padding:10px 24px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:1.1em;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal;text-align:center;line-height:1.2;min-width:0;max-width:100%}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.big{min-height:84px;font-size:1.5em;border-radius:22px;padding:12px 32px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar .logo{font-weight:800;font-size:1.3em;color:var(--brand);flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mk{width:1.25em;height:1.25em;flex:0 0 auto;color:var(--brand)}
.bar .sp{flex:1}
.search{flex:1 1 150px;min-width:0;max-width:520px;color:var(--ink);height:48px;border:2px solid var(--line);border-radius:24px;padding:0 18px;background:var(--card);color:var(--ink)}
.chip{min-height:44px;padding:6px 16px;border-radius:22px;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;white-space:normal;min-width:0}
#offline{background:#b45309;color:#fff;text-align:center;padding:6px;font-weight:600}
/* home */
#home{align-items:center;justify-content:flex-start;text-align:center;padding:68px 24px calc(76px + env(safe-area-inset-bottom,0px));gap:22px;background:var(--backdrop);overflow-y:auto}
#home::before,#home::after{content:'';margin:auto}
#home h1{margin:0;color:var(--ink);font-size:calc(3em);line-height:1.1;max-width:100%;overflow-wrap:anywhere}
#home p{margin:0;color:var(--mute);font-size:1.4em;max-width:100%}
#home .modes{display:flex;gap:20px;flex-direction:column;align-items:center;width:100%;margin-top:12px}
#home .modes .btn{background:var(--card);color:var(--ink);border:2px solid var(--line);width:min(520px,92%);box-shadow:0 1px 3px rgba(15,23,42,.08)}
#home .modes .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 10px 24px -10px var(--brand)}
#home .tools{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:20}#home .tools .lang{position:static;min-width:56px;justify-content:center}
#feat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:100%;max-height:7.4em;overflow:hidden;margin-top:6px}
#feat .f,.banner{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:10px 16px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.banner{background:var(--soft);color:var(--brand);font-weight:700;max-width:90%}
.waitchip{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--soft);color:var(--brand);border-radius:999px;padding:8px 16px;font-weight:800;max-width:100%;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.pw{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-weight:600;font-size:.85em;line-height:1}.pw .mk{width:1.7em;height:1.7em}
.pw .pwt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.pw .pwt small{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute);opacity:.9}
.pw .pwt b{font-size:1.15em;font-weight:800;letter-spacing:.02em;color:var(--ink)}
#home .pw{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:15;padding:9px 18px 9px 14px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 4px 14px -6px rgba(15,23,42,.25);white-space:nowrap;pointer-events:none}
@media (max-height:560px) and (orientation:landscape){#home{padding-bottom:20px}#home .pw{position:static;transform:none;flex:0 0 auto;margin:6px auto 0}}
#home .tiny{position:fixed;left:0;top:0;width:90px;height:90px;z-index:19}
/* order */
#order .body{flex:1;min-height:0;display:flex}
.cats{width:170px;flex:0 0 auto;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:8px}
.cat{width:100%;text-align:left;padding:16px 14px;border-radius:14px;font-weight:700;margin-bottom:6px;line-height:1.2}
.cat.on{background:var(--brand);color:#fff}
.grid{flex:1;min-width:0;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-content:start}
.p{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;box-shadow:0 1px 3px #0001;position:relative}
.p:active{transform:scale(.97)}
.p .img{aspect-ratio:4/3;background:#eee center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4em;font-weight:800;color:#fff}
.p .txt{display:flex;flex-direction:column}
.p .nm{padding:10px 12px 2px;font-weight:700;line-height:1.2;min-height:2.6em}
.p .pr{padding:0 12px 12px;color:var(--brand);font-weight:800;font-size:1.15em}
.p .tags{position:absolute;top:8px;left:8px;max-width:calc(100% - 52px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:1}
.p .tag{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:2px 8px;font-size:.8em;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.hot{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.p .inc{position:absolute;right:8px;top:8px;background:var(--brand);color:#fff;border-radius:12px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 8px}
.p.out{opacity:.5;pointer-events:none}
.cart{width:340px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.lines{flex:1;overflow-y:auto;padding:6px 12px}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.ln .i{flex:1;min-width:0}.ln .i b{display:block;line-height:1.2}.ln .i small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:12px;background:var(--alt);color:var(--ink);font-size:1.3em;font-weight:800}
.qty span{min-width:26px;text-align:center;font-weight:800}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.tot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot .row{display:flex;justify-content:space-between;font-weight:800;font-size:1.3em}
.lang{min-height:44px;min-width:64px;padding:4px 14px;border-radius:22px;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:normal;line-height:1.15}
#home{position:relative}
.p .add{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-size:1.5em;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0003}
.cart .grab{display:none}
#mini{display:none}
.ln .x{color:var(--bad);font-size:1.2em;width:36px;height:36px}
/* short / landscape phone: keep cart on the side, compact horizontal product cards */
@media (max-height:560px) and (orientation:landscape){
 .bar{padding:6px 12px}.chip,.lang{height:38px}.search{height:38px}.bar .logo{display:none}
 .cats{width:120px;padding:6px}.cat{padding:10px 8px;font-size:.88em;margin-bottom:4px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:8px}
 .p{flex-direction:row;align-items:center;min-height:72px}
 .p .img{width:72px;height:72px;aspect-ratio:1;font-size:1.6em;flex:0 0 auto}
 .p .nm{padding:6px 8px 0;min-height:0;font-size:.95em;flex:1}.p .pr{padding:0 8px 6px;font-size:1em}
 .p .txt{flex:1;min-width:0;padding-right:48px}.p .add{width:34px;height:34px;bottom:auto;top:50%;margin-top:-17px}
 .cart{width:250px}.cart h3{padding:8px 12px;font-size:1em}.tot{padding:8px 12px;gap:6px}.tot .row{font-size:1.1em}
 #co{min-height:46px!important;font-size:1em!important}
 #home h1{font-size:2em}#home p{font-size:1.1em}#home{gap:12px}.btn.big{min-height:60px;font-size:1.2em;padding:8px 18px}
 .pcard{padding:12px}.pcard .img{width:110px;height:110px}.pcard .big{font-size:2.4em}
 #done{gap:6px;overflow-y:auto;padding:10px}#done .no{font-size:4em}
 .md{max-height:96%}
}
html.dark{--brand:#7c5cff;--brandh:#6a48ff;--bg:#121218;--card:#1c1c24;--ink:#f5f5f7;--mute:#9a9ba8;--line:#262733;--soft:rgba(124,92,255,.16);--alt:#22232d;--navy:#22232d;--warn:#fbbf24;--backdrop:radial-gradient(circle at 15% 20%,rgba(56,189,248,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(192,132,252,.07),transparent 42%),#121218;color-scheme:dark}
html.dark .tag.hot{background:#431407;color:#fdba74;border-color:#9a3412}
#clk{font-weight:700;opacity:.9}
.th{width:44px;height:44px;border-radius:10px;background:#eee center/cover;flex:0 0 auto;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.err{color:var(--bad);font-weight:700;min-height:1.3em;margin-top:6px}.chk{display:flex;gap:10px;align-items:center;font-weight:600}.chk input{width:26px;height:26px}
#pager,#stepbar{display:none}
html.pv #stepbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 10px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);font-size:.8em;font-weight:700}
#stepbar span{display:flex;align-items:center;gap:6px;opacity:.6;padding:4px 10px;border-radius:999px;min-width:0}#stepbar span.on{opacity:1;background:var(--brand);color:#fff}#stepbar span.dn{opacity:.9}
#stepbar b{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--alt);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:.9em}#stepbar span.on b{background:#fff;color:var(--brand)}
html.pv .body{flex-direction:column;padding-bottom:84px}
html.pv .cats{width:auto;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:8px;flex:0 0 auto}
html.pv .cat{width:auto;white-space:nowrap;flex:0 0 auto;margin:0;padding:12px 20px;border-radius:999px;background:var(--card);color:var(--ink);border:2px solid var(--line)}html.pv .cat.on{color:#fff}html.pv .cat.on{border-color:var(--brand);background:var(--brand)}
html.pv .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;overflow:hidden;gap:12px;padding:12px;align-content:stretch}
html.pv .p{flex-direction:column;align-items:stretch;min-height:0}
html.pv .p .img{width:100%;height:auto;aspect-ratio:auto;flex:1 1 auto;min-height:0;font-size:2.6em}
html.pv .p .txt{padding-right:0}html.pv .p .nm{min-height:0;font-size:1.05em}html.pv .p .add{bottom:10px;top:auto;margin:0;width:46px;height:46px;right:10px}
html.pv #pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px;flex:0 0 auto}
#pager .dots{display:flex;gap:6px}#pager .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}#pager .dots i.on{background:var(--brand);width:22px;border-radius:5px}#pager .pgn{font-weight:700;color:var(--mute)}
html.pv .cart{display:none;position:fixed;inset:0;width:auto;z-index:8;border:0}html.pv .cart.open{display:flex}
html.pv .cart .grab{display:block;padding:16px;font-weight:800;color:var(--brand);background:var(--card);border-bottom:1px solid var(--line)}
html.pv #mini{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));gap:10px;align-items:center;justify-content:space-between;font-weight:800;font-size:1.05em;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px #0004;max-width:100%}
html.pv #mini span{min-width:0;overflow-wrap:anywhere}
html.pv #mini::after{content:attr(data-go);background:var(--brand);padding:10px 16px;border-radius:14px;white-space:normal;text-align:center;line-height:1.2;flex:0 1 auto;max-width:56%;overflow-wrap:anywhere}
html.pv #home{padding:24px}
.p .imgw{position:relative;display:flex;flex:1 1 auto;min-height:0}.p .imgw .img{width:100%}
.p .inc{top:8px;right:8px;left:auto;z-index:1}
.p .txt{flex:0 0 auto;padding:0}.p .nm{padding:10px 12px 2px;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.p .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px 12px}
.p .row .pr{padding:0;min-width:0}
html .p .row .add{position:static;width:44px;height:44px;margin:0;flex:0 0 auto;font-size:1.6em;line-height:1}
.ln{display:grid;grid-template-columns:48px 1fr auto;gap:6px 10px;align-items:start}
.th{width:48px;height:48px}.ln .th{grid-row:1/3}.ln .i{grid-column:2;grid-row:1}.ln .x{grid-column:3;grid-row:1;justify-self:end}
.ln .qty{grid-column:2;grid-row:2}.ln .lt{grid-column:3;grid-row:2;align-self:center;font-weight:800;white-space:nowrap}
.bar{flex-wrap:nowrap}.bar .search{min-width:0;flex:1}.bar>.chip,.bar>.lang{flex:0 0 auto;white-space:nowrap}
@media (max-width:520px){.bar{flex-wrap:wrap}.bar .search,html.pv .bar .search{order:9;flex:1 1 100%;min-width:0}.bar .logo{display:none}}
html.pv #toast{bottom:auto;top:10px}
#toast{background:var(--navy);border:1px solid var(--line)}
html.pv .bar .logo{display:none}
html.pv .bar{gap:8px;padding:8px 10px}html.pv .bar .search{height:42px}html.pv .bar .chip{padding:0 12px}
@media (max-height:560px) and (orientation:landscape){.p .imgw{flex:0 0 72px;width:72px;height:72px}.p .imgw .img{height:100%}.p .txt{flex:1;min-width:0;padding:0}.p .nm{padding:6px 8px 0;font-size:.95em}.p .row{padding:2px 8px 8px}.p .row .pr{font-size:1em}html .p .row .add{width:36px;height:36px}.p .tags{top:2px;left:2px}.p .tag{font-size:.65em;padding:1px 5px}.p .inc{top:2px;right:2px;min-width:22px;height:22px;font-size:.8em}.cart{width:276px}.cart .lines{overflow-x:hidden}.qty{gap:4px}.qty button{width:34px;height:34px;font-size:1.1em}.qty span{min-width:22px}.ln{gap:4px 8px;grid-template-columns:44px 1fr auto}.th{width:44px;height:44px}}
/* modal */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:var(--card);border-radius:24px;width:min(640px,100%);max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.md header{padding:18px 20px;font-weight:800;font-size:1.3em;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.md .c{padding:16px 20px;overflow-y:auto;overflow-x:hidden;flex:1}
.md footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center}
.md footer .btn{flex:1 1 140px;padding:10px 16px}.md footer .btn.big{min-height:64px;font-size:1.25em}
.grp{margin-bottom:18px}.grp h4{margin:0 0 8px}.grp h4 em{color:var(--bad);font-style:normal;font-size:.8em;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{padding:12px 18px;border-radius:14px;border:2px solid var(--line);font-weight:700;background:var(--card);color:var(--ink);white-space:normal;text-align:center;line-height:1.2;min-width:0}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input,.field textarea{border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
.seg{display:flex;gap:10px;flex-wrap:wrap}
/* success */
#done{align-items:center;justify-content:flex-start;text-align:center;gap:14px;padding:20px;overflow-y:auto}
#done::before,#done::after{content:'';margin:auto}
html.pv #done .no{font-size:4.5em}html.pv #done{gap:10px}
#done .no{font-size:7em;font-weight:900;color:var(--brand);line-height:1}
/* price check */
#pc .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pcard{background:var(--card);border-radius:24px;padding:24px;width:min(720px,100%);display:flex;gap:22px;align-items:center;box-shadow:0 2px 8px #0001}
.pcard .img{width:200px;height:200px;border-radius:18px;background:#eee center/cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:4em;color:#fff;font-weight:800}
.pcard .big{font-size:clamp(1.8em,9vw,3.4em);font-weight:900;color:var(--brand);line-height:1.1;overflow-wrap:anywhere}
.pcard{max-width:100%;min-width:0;overflow:hidden}.pcard>div{min-width:0}
.pcard .img{max-width:42%;height:auto;aspect-ratio:1}
.pcard.li{padding:12px;gap:12px;width:100%}.pcard.li .img{width:84px;max-width:84px;font-size:2em;border-radius:14px}
.pcard.li .nm{font-weight:800;font-size:1.15em;line-height:1.2;overflow-wrap:anywhere}
.pcard.li .big{font-size:clamp(1.3em,6.5vw,2em)}
.pcard .go{flex:0 0 auto;width:52px;min-width:52px;min-height:52px;padding:0;font-size:1.6em}
#pc .body{overflow-x:hidden}#pcr{max-width:760px;margin:0 auto}
@media (max-width:640px){.pcard.det{flex-direction:column;text-align:center;padding:18px}.pcard.det .img{width:min(60%,240px);max-width:none}}
html.pv .pcard.det{flex-direction:column;text-align:center;padding:18px}html.pv .pcard.det .img{width:min(60%,240px);max-width:none}
.hint{color:var(--mute);text-align:center;font-size:1.2em;padding:30px}
/* queue */
#q .cols{flex:1 1 0;min-height:0;display:flex;flex-direction:row;flex-wrap:nowrap;gap:0}
#q .col{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;padding:0;text-align:center;overflow:hidden}
#q .col.r{border-left:2px solid var(--line)}

#q .n{font-size:clamp(1.6em,min(7vw,12vh),4em);font-weight:900;background:var(--card);color:var(--ink);border-radius:20px;padding:4px 18px;box-shadow:0 2px 6px #0002;max-width:100%}

/* toast / pin / idle */

.pin{display:grid;grid-template-columns:repeat(3,minmax(0,84px));gap:10px;justify-content:center;margin-top:10px}

.dots{text-align:center;font-size:2em;letter-spacing:10px;min-height:1.4em}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
html.pv .bar .lang .ln{display:none}html.pv .bar .lang{min-width:44px;padding:0 12px;justify-content:center}
html.pv .bar .search{flex:1 1 110px;min-width:110px;font-size:.95em}html.pv .bar .chip{padding:0 12px}html.pv .bar .sp{display:none}
html.pv .p .row{flex-wrap:wrap;row-gap:2px}html.pv .p .row .pr{font-size:.95em;white-space:nowrap}
html.pv .p .nm{-webkit-line-clamp:3;font-size:1em}
html.pv .p .row .add{width:40px;height:40px}
/* wait estimate + booking slot picker */
.waitrow{color:var(--brand);background:var(--soft);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.95em;line-height:1.25;overflow-wrap:anywhere}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.day{padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;line-height:1.2;font-weight:800;min-width:0;white-space:normal}
.day small{display:block;color:var(--mute);font-weight:600}
.day.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand)}.day.on small{color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.slot{min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;padding:4px 6px;line-height:1.15;text-align:center;min-width:0;white-space:normal}
.slot small{display:block;font-size:.72em;color:var(--mute);font-weight:600}
.slot.on{border-color:var(--brand);background:var(--brand);color:#fff}.slot.on small{color:#ffffffd0}
.slot[disabled]{opacity:.4;pointer-events:none}.slot[disabled] b{text-decoration:line-through}
.slotmsg{color:var(--mute);text-align:center;padding:14px 6px;font-weight:600}

 .grid,html.pv .grid{align-content:start}
 html.pv .grid{grid-auto-rows:auto;overflow-y:auto;overflow-x:hidden}
 .p,html.pv .p{display:block;aspect-ratio:1/1;min-height:0;height:auto;padding:0}
 .p .imgw,html.pv .p .imgw{position:absolute;inset:0;display:block;width:100%;height:100%;flex:none;min-height:0}
 .p .imgw .img,html.pv .p .imgw .img{width:100%;height:100%;aspect-ratio:auto;flex:none;min-height:0;border-radius:0}
 .p .txt,html.pv .p .txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:26px 56px 8px 10px;background:linear-gradient(to top,rgba(0,0,0,.8) 0,rgba(0,0,0,.52) 55%,rgba(0,0,0,0) 100%)}
 .p .nm,html.pv .p .nm{padding:0;min-height:0;color:#fff;font-size:.92em;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.6);-webkit-line-clamp:2}
 .p .row,html.pv .p .row{display:block;padding:2px 0 0}
 .p .row .pr,html.pv .p .row .pr{padding:0;color:#fff;font-size:1.05em;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}

 html .p .row .add,html.pv .p .row .add{position:absolute;right:8px;bottom:8px;width:40px;height:40px;margin:0;font-size:1.5em}
}

#done #qr{display:inline-block;background:#fff;padding:14px;border-radius:16px;line-height:0;box-shadow:0 2px 8px #0002}
#done #qr canvas,#done #qr img{width:168px!important;height:168px!important}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.ov{animation:fadein .18s ease-out;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

.ups{display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--ok) 18%,var(--card));border:2px solid var(--ok);border-radius:14px;padding:2px}

let TOKEN=null;const pend={};let rid=1;
window.__kioskResp=function(id,status,text){const p=pend[id];if(!p)return;delete pend[id];p({status,text})};
window.__kioskRespB64=function(id,status,b64){let text='';try{const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);text=new TextDecoder('utf-8').decode(u)}catch(e){}window.__kioskResp(id,status,text)};
function rawReq(method,path,body,auth){
  const url=S.server.replace(/\/+$/,'')+path;
  const headers={'Content-Type':'application/json'};if(auth&&TOKEN)headers.Authorization='Bearer '+TOKEN;
  const bs=body==null?null:JSON.stringify(body);
  if(NATIVE){return new Promise(res=>{const id=rid++;pend[id]=res;setTimeout(()=>{if(pend[id]){delete pend[id];res({status:0,text:''})}},20000);NATIVE.request(id,method,url,JSON.stringify(headers),bs)})}
  return fetch(url,{method,headers,body:bs}).then(r=>r.text().then(text=>({status:r.status,text}))).catch(()=>({status:0,text:''}));
}
let AUTH_BLOCK=0,credBad=false;
async function login(force){
  if(!force&&(credBad||Date.now()<AUTH_BLOCK))return {ok:false,status:429,message:lastErr||L('Naka-pause ang login — i-check ang username/password sa Admin > Server.','Login paused — check the username/password in Admin > Server.')};
  const r=await rawReq('POST','/api/auth/login',{username:S.user,password:S.pass},false);
  let j={};try{j=JSON.parse(r.text)}catch(e){}
  if(r.status===200&&j.token){TOKEN=j.token;credBad=false;AUTH_BLOCK=0;return {ok:true}}
  if(r.status===429||/too many/i.test(j.message||'')){const m=/in (\d+) second/.exec(j.message||'');AUTH_BLOCK=Date.now()+((m?+m[1]:30)+3)*1000}
  else if(r.status===401||r.status===403||r.status===400)credBad=true;
  return {ok:false,status:r.status,message:j.message||(r.status===0?t('noserver'):t('nologin')),otp:!!(j.otpRequired||j.requiresOtp)};
}
async function api(method,path,body){
  if(!TOKEN){const l=await login();if(!l.ok)return {ok:false,status:l.status||0,data:{message:l.message}}}
  let r=await rawReq(method,path,body,true);
  if(r.status===401){const l=await login();if(!l.ok)return {ok:false,status:401,data:{message:l.message}};r=await rawReq(method,path,body,true)}
  let j={};try{j=JSON.parse(r.text)}catch(e){}
  noteLock(path,r.status,j);
  return {ok:r.status>=200&&r.status<300&&j.success!==false,status:r.status,data:j};
}
/* ---------- license lock (Self-Order Kiosk subscription) ----------
   The OMNIPOS server answers HTTP 402 {featureLocked:true} on every /api/kiosk/* call while the subscription is not active.
   That is not an outage: show the "unavailable" screen (never the cached catalog) and keep re-checking until it is active again. */
let LOCKED=null;
function noteLock(path,status,j){
  if(!/^\/api\/kiosk\//.test(path))return;
  if(status===402&&j&&j.featureLocked){const was=!!LOCKED;LOCKED=j;if(!was)setTimeout(onLockChange,0)}
  else if(LOCKED&&status>=200&&status<300&&j&&j.success!==false){LOCKED=null;setTimeout(onLockChange,0)}
}
function onLockChange(){
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  if(typeof warnEl!=='undefined'&&warnEl){warnEl=null}
  if(LOCKED){cart=[];rLocked()}else go('home');
}

function prod(code){return CAT&&CAT.products.find(p=>p.code===code)}
function fetchImages(codes){
  const need=codes.filter(c=>!IMG.has(c)&&!IMGREQ.has(c)&&prod(c));
  for(let i=0;i<need.length;i+=10){
    const chunk=need.slice(i,i+10);chunk.forEach(c=>IMGREQ.add(c));
    api('POST','/api/products/images',{codes:chunk}).then(r=>{
      if(!r.ok){chunk.forEach(c=>IMGREQ.delete(c));setTimeout(()=>fetchImages(chunk),4000);return}
      const items=(r.data&&r.data.items)||{};
      chunk.forEach(c=>{const it=items[c];const im=it&&(it.image||(it.images&&it.images[0]));IMG.set(c,im||'')});
      paintImages();
    });
  }
}

/* ---------- cart ---------- */
const lineKey=l=>[l.code,l.unit||'',(l.options||[]).map(o=>o.group+':'+o.name).sort().join('|'),l.note||''].join('#');
function unitPrice(p,unit){if(!unit)return p.price;const u=p.uom.find(x=>x.name===unit);return u?(u.fixedPrice>0?u.fixedPrice:Math.round(p.price*u.factor*100)/100):p.price}
function lineTotal(l){return (l.unitPrice+(l.options||[]).reduce((a,o)=>a+o.price,0))*l.qty}
function cartTotal(){return Math.round(cart.reduce((a,l)=>a+lineTotal(l),0)*100)/100}
function cartCount(){return cart.reduce((a,l)=>a+l.qty,0)}
function stockLeft(code,excludeKey){const p=prod(code);if(!p)return 0;let used=0;cart.forEach(l=>{if(l.code===code&&lineKey(l)!==excludeKey)used+=l.qty*(l.factor||1)});return p.stock-used}
function addLine(p,o){
  o=o||{};const unit=o.unit||null,f=unit?(p.uom.find(x=>x.name===unit)||{}).factor||1:1,qty=o.qty||1;
  const l={code:p.code,name:p.name,unit,factor:f,unitPrice:unitPrice(p,unit),qty,options:o.options||[],note:o.note||''};
  if(stockLeft(p.code)<qty*f-1e-9){toast(p.name+': '+t('oos'));return false}
  const ex=cart.find(x=>lineKey(x)===lineKey(l));
  if(ex){if(ex.qty+qty>(CFG.maxQtyPerLine||20)){toast(t('max')+' '+CFG.maxQtyPerLine);return false}ex.qty+=qty}else cart.push(l);
  renderCart();updateBadges();return true;
}
function changeQty(i,d){const l=cart[i];if(!l)return;const nq=l.qty+d;if(nq<=0){cart.splice(i,1)}else{if(d>0&&(stockLeft(l.code)<l.factor-1e-9||nq>(CFG.maxQtyPerLine||20))){toast(t('oos'));return}l.qty=nq}renderCart();updateBadges()}

   <div class="field"><label>${esc(t('srv'))}</label><input id="s_srv" value="${esc(S.server||'')}" inputmode="url" autocapitalize="off"><div id="s_found" style="margin-top:8px;font-weight:600"></div><button class="btn ghost" id="s_find" style="margin-top:8px;min-height:44px">🔍 ${esc(L('Hanapin ang OMNIPOS server','Find OMNIPOS server'))}</button></div>
   <div class="field"><label>${esc(t('usr'))}</label><input id="s_usr" value="${esc(S.user||'')}" autocapitalize="off"></div>
   <div class="field"><label>${esc(t('pw'))}</label><input id="s_pw" type="password" value="${esc(S.pass||'')}"></div>
   <div class="field"><label>${esc(t('pinlbl'))}</label><input id="s_pin" inputmode="numeric" value="${esc(S.pin||'')}" maxlength="8"></div>
   <div id="s_msg" style="min-height:1.4em;font-weight:600"></div>
  </div><footer><button class="btn" id="s_ok">${esc(t('connect'))}</button></footer>`);
  $('#s_lg',m).onclick=()=>{S.server=$('#s_srv',m).value;S.user=$('#s_usr',m).value;S.pass=$('#s_pw',m).value;S.pin=$('#s_pin',m).value;LANG=S.lang=LANG==='tl'?'en':'tl';m.close();setupScreen(msg)};
  const runFind=async()=>{const f=$('#s_found',m);f.textContent='⏳ '+L('Naghahanap sa LAN…','Searching the LAN…');const a=await discover();
    if(!a.length){f.textContent='⚠ '+L('Walang nahanap. Siguraduhing nasa parehong WiFi at tumatakbo ang OMNIPOS.','Nothing found. Make sure you are on the same WiFi and OMNIPOS is running.');return}
    const pick=u=>{$('#s_srv',m).value=u;f.textContent='✅ '+L('Nahanap: ','Found: ')+u};
    if(a.length===1)pick(a[0]);else{f.innerHTML=a.map(u=>`<button class="chip" data-u="${esc(u)}" style="margin:2px">${esc(u)}</button>`).join('');f.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u))}};
  $('#s_find',m).onclick=runFind;if(!S.server)setTimeout(runFind,300);
  $('#s_ok',m).onclick=async()=>{
    S.server=$('#s_srv',m).value.trim().replace(/\/+$/,'');if(S.server&&!/^https?:\/\//.test(S.server))S.server='http://'+S.server;
    S.user=$('#s_usr',m).value.trim();S.pass=$('#s_pw',m).value;S.pin=$('#s_pin',m).value.trim()||'1234';
    $('#s_msg',m).textContent=t('connecting');TOKEN=null;credBad=false;AUTH_BLOCK=0;
    const l=await login(true);
    if(!l.ok){$('#s_msg',m).style.color='var(--bad)';$('#s_msg',m).textContent=l.otp?t('otp'):l.message;return}
    const r=await loadCatalog(true);
    if(LOCKED){saveSettings(S);m.close();rLocked();return}
    if(!r.ok&&!CAT){$('#s_msg',m).style.color='var(--bad)';$('#s_msg',m).textContent=(r.data&&r.data.message)||t('nomod');return}
    saveSettings(S);m.close();go('home');
  };
}

/* ---------- idle handling ---------- */
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
let warnEl=null;
setInterval(()=>{
  if(view==='home'||view==='q'||view==='done'||!CFG.idleSeconds)return;
  const idle=(Date.now()-lastAct)/1000,lim=CFG.idleSeconds||60;
  if(idle>lim+10){if(warnEl){warnEl.close();warnEl=null}cart=[];document.querySelectorAll('.ov').forEach(o=>o.remove());go('home')}
  else if(idle>lim&&!warnEl&&(cart.length||view!=='pc')){
    if(!cart.length&&view!=='order'){go('home');return}
    warnEl=modal(`<header>⏱ ${esc(t('stillhere'))}</header><div class="c" style="text-align:center"><div class="spin"></div><div class="cd" id="cd"></div></div><footer><button class="btn big" id="im">${esc(t('touch'))}</button></footer>`);
    $('#im',warnEl).onclick=()=>{warnEl.close();warnEl=null;lastAct=Date.now()};
  }else if(idle<=lim&&warnEl){warnEl.close();warnEl=null}
  if(warnEl){const cd=$('#cd',warnEl);if(cd)cd.textContent=Math.max(0,Math.ceil(lim+10-idle))+'s'}
},1000);
let tk=0;setInterval(async()=>{ // pana-panahong
  if(credBad||Date.now()<AUTH_BLOCK)return; // huwag nang ulit-ulitin ang maling login (iwas lockout) refresh ng catalog (presyo/stock) habang walang ginagawa sa home
  if(LOCKED){await loadCatalog();return} // locked: re-check every 15s; onLockChange() brings the home screen back once the subscription is active
  if(online&&(++tk%4))return;
  if(view==='home'||view==='pc'){const was=online;await loadCatalog();if(view==='home'&&(was!==online||!online))rHome();else if(view==='home')updWait()}
},15000);

/* ---------- boot ---------- */
(async function boot(){
  app.innerHTML='<div class="spin" style="margin-top:40vh"></div>';
  if(!S.server||!S.user){app.innerHTML='';setupScreen();return}
  const r=await loadCatalog(true);
  if(LOCKED){rLocked();return}
  if(!r.ok&&!CAT){app.innerHTML='';setupScreen((r.data&&r.data.message)||t('noserver'));return}
  go('home');
})();
/* Safety net: kung may button na lumampas pa rin sa screen (napakahabang salita, malaking text mode), paliitin ang font nito hanggang magkasya. */
const FITSEL='.btn,.chip,.lang,.opt,.slot,.day';let fitT=0;
function fitButtons(){
  cancelAnimationFrame(fitT);
  fitT=requestAnimationFrame(()=>{const vw=document.documentElement.clientWidth;
    document.querySelectorAll(FITSEL).forEach(b=>{if(!b.offsetParent)return;if(b.dataset.fit){b.style.fontSize='';delete b.dataset.fit}
      const bad=()=>{const r=b.getBoundingClientRect();return b.scrollWidth>b.clientWidth+2||r.right>vw+1||r.left<-1};
      let n=0;while(n++<10&&bad()){const fs=parseFloat(getComputedStyle(b).fontSize);if(fs<=11)break;b.style.fontSize=(fs-1)+'px';b.dataset.fit=1}});
  });
}
new MutationObserver(fitButtons).observe(document.body,{childList:true,subtree:true,characterData:true});
addEventListener('resize',fitButtons);
window.__kiosk={go,get cart(){return cart},fitButtons}; // para sa testing
})();
</script>
