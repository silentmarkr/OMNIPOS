/* ===== POS-terminal look (matches OmniPOS sidebar, cards, pills and mono prices) ===== */
:root{--mono:'IBM Plex Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--side:#22314a;--sidebar-ink:#c7d4ea;--rad:16px;--sh:0 2px 8px rgba(15,23,42,.08)}

html,body{font-size:16px}
body{background:radial-gradient(circle at 15% 20%,rgba(56,189,248,.06),transparent 40%),radial-gradient(circle at 85% 80%,rgba(168,85,247,.05),transparent 42%),var(--bg);background-attachment:fixed}
html.dark body{background:radial-gradient(circle at 15% 20%,rgba(56,189,248,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(192,132,252,.07),transparent 42%),var(--bg);background-attachment:fixed}
#app:not(.hide){display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:236px;flex:0 0 236px;background:var(--side);color:#94a3b8;display:flex;flex-direction:column;z-index:20}
.sb-brand{padding:20px 20px;font-size:1.25rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}

.sb-menu{padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.sb-label{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8b9dc3;padding:6px 16px}
.side .sb-menu button{display:flex;align-items:center;gap:0;width:100%;text-align:left;background:transparent;color:var(--sidebar-ink);font-weight:500;border-radius:8px;padding:10px 16px;border:0;transition:all .2s;position:relative;min-height:48px}
.side .sb-menu button i{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;margin-right:12px;border-radius:8px;background:rgba(148,163,184,.08);transition:all .2s;flex:0 0 auto}
.side .sb-menu button:hover,.side .sb-menu button.on{color:#fff;background:linear-gradient(90deg,var(--b),var(--bh));box-shadow:inset 3px 0 0 0 #fff}

.side .sb-menu button .lb{flex:1}

.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:15;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--alt);color:var(--m);font-weight:700;font-size:.85rem;font-family:var(--mono)}
#st{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.85rem;color:var(--m)}
main{padding:18px;max-width:1500px;width:100%;margin:0 auto}
/* KPI */
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--l);border-radius:var(--rad);padding:12px 14px;box-shadow:var(--sh)}

.tools{top:var(--hh,64px);padding:8px 0}

.cards{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.stp{font-size:.68rem}.stp span{overflow-wrap:normal;word-break:normal;white-space:nowrap}
.o{border:1px solid var(--l);border-left:1px solid var(--l);border-top:5px solid var(--b);border-radius:var(--rad);box-shadow:var(--sh);padding:14px 14px 12px;transition:transform .12s,box-shadow .2s}
.o.preparing{border-top-color:var(--warn)}.o.ready{border-top-color:var(--ok)}
.o.paid{box-shadow:0 0 0 2px var(--ok) inset,var(--sh)}
.o.late{animation:late 2s ease-in-out infinite}@keyframes late{0%,100%{box-shadow:var(--sh)}50%{box-shadow:0 0 0 3px rgba(220,38,38,.35),var(--sh)}}

.pdb,.upb,.el,.tbl{font-size:.82rem}
button{transition:background .15s,transform .08s}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--soft);outline-offset:2px;border-color:var(--b)}
.empty{border:2px dashed var(--l);border-radius:var(--rad);background:var(--card);color:var(--m);font-weight:600}

.box{border-radius:var(--rad);box-shadow:var(--sh)}
.box h3{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.stat div{border:1px solid var(--l);border-radius:14px}.stat b{font-family:var(--mono);font-variant-numeric:tabular-nums}

}

<script>
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 def:{orders:'Orders',prep:'🍳 Preparing',ready:'✅ Ready',done:'💰 Paid / Done',recv:'📦 Received',empty:'No open orders. Waiting for new orders…',sum:'Orders today',sales:'Sales (kiosk)',top:'Top items today',none:'No orders yet.'},
 service:{orders:'Bookings',prep:'🛠 In progress',ready:'✅ Ready / Done',done:'💰 Paid / Done',recv:'📦 Received',empty:'No open bookings. Waiting for new bookings…',sum:'Bookings today',sales:'Sales (kiosk)',top:'Top services today',none:'No bookings yet.'}
};
const FIT={

 restaurant:'Best fit: self-order, options/add-ons, upsell, Order Status board.',
 minimart:'Good fit: Price Check and pick-up orders; no kitchen/board needed.',
 sari:'Good fit: Price Check only (turn self-order off).',
 service:'Good fit: service and price list, booking/check-in and Schedule Status (ongoing / ready). Not a stock-based self-checkout.',
 pharmacy:'Good fit: Price Check and pick-up orders (with a prescription reminder).',
 hardware:'Good fit: Price Check, order/quote, pick-up or delivery.'
};
let BIZC='general';
const L=()=>LBL[BIZC==='service'?'service':'def'];
const apptOf=o=>{if(o&&o.appt&&o.appt.date)return {d:o.appt.date,t:o.appt.time||'',k:o.appt.date+' '+(o.appt.time||'00:00')};const m=/Appt:(\d{4}-\d\d-\d\d)(?: (\d\d:\d\d))?/.exec((o&&o.note)||'');return m?{d:m[1],t:m[2]||'',k:m[1]+' '+(m[2]||'00:00')}:null};
const cleanNote=o=>String((o&&o.note)||'').replace(/Appt:\d{4}-\d\d-\d\d(?: \d\d:\d\d)?/,'').split('|').map(x=>x.trim()).filter(x=>x&&!/^(Pax|Allergy)\s*:/i.test(x)).join(' | '); // party size and allergy are shown in their own badges
// Structured fields saved by the server; fall back to parsing the note for orders placed before they existed.
const orderAllergy=o=>String((o&&o.allergy)||'').trim()||((String((o&&o.note)||'').match(/Allergy\s*:\s*([^|;]+)/i)||[])[1]||'').trim();
const orderPax=o=>{const n=parseInt(o&&o.pax,10);if(n>0)return String(n);const m=String((o&&o.note)||'').match(/(?:^|[|;\s])Pax\s*:\s*(\d+)/i);return m?m[1]:''};
// Per-dish kitchen progress (Kitchen Kiosk). Orders from before the kitchen workflow inherit their state from the order status.
function kitchenProgress(o){
 if(BIZC!=='restaurant'||!o||!Array.isArray(o.items)||!o.items.length)return null;
 const inh=o.status==='ready'||o.status==='done'?'ready':o.status==='preparing'?'preparing':'new';let r=0,p=0,sig='';
 o.items.forEach(i=>{const k=['new','preparing','ready'].includes(i&&i.kitchenStatus)?i.kitchenStatus:inh;if(k==='ready'){r++;sig+='R'}else if(k==='preparing'){p++;sig+='P'}else sig+='N'});
 return {r,p,n:o.items.length,sig};
}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const t12=hm=>{if(!hm)return '';const a=hm.split(':'),h=+a[0]||0;return ((h%12)||12)+':'+(a[1]||'00')+' '+(h<12?'AM':'PM')};
function apptLabel(a){const n=new Date(),tm=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);const day=a.d===ymd(n)?'Today':a.d===ymd(tm)?'Tomorrow':new Date(a.d+'T12:00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});return day+(a.t?' · '+t12(a.t):'')}
/* Theme: follows OmniPOS (localStorage 'omnipos_theme': 'day' = day mode, anything else = dark). The 🌙/☀️ button is a temporary override for this counter. */
function isDarkNow(){try{const o=localStorage.getItem('kc_theme');if(o==='day'||o==='dark')return o==='dark';let t=localStorage.getItem('omnipos_theme');if(!t)t=localStorage.getItem('omnipos_darkmode')==='true'?'dark':'day';return t!=='day'}catch(e){return false}}
function applyTheme(){document.documentElement.classList.toggle('dark',isDarkNow());const b=document.getElementById('th');if(b)b.textContent=isDarkNow()?'☀️':'🌙'}
document.getElementById('th').onclick=()=>{try{localStorage.setItem('kc_theme',isDarkNow()?'day':'dark')}catch(e){}applyTheme()};
addEventListener('storage',e=>{if(e.key==='omnipos_theme'||e.key==='omnipos_darkmode'){try{localStorage.removeItem('kc_theme')}catch(x){}applyTheme()}});applyTheme();
/* lastIds: null = "force a re-render" (an EMPTY order list also has ids==='' so '' cannot be the reset value, otherwise closing the last order never repaints) */
let TOKEN=sessionStorage.getItem('kc_tok')||'',ME=null,tab=1,orders=[],lastIds=null,CFGX=null,PRODS=[],LOCKED=false,LIC=null;
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b?JSON.stringify(b):undefined});if(r.status===401){logout();throw new Error('401')}
 const j=await r.json();if(r.status===402&&j&&j.featureLocked){showLock(j);throw new Error('LOCKED')}return j}
window.addEventListener('unhandledrejection',e=>{if(e.reason&&e.reason.message==='LOCKED')e.preventDefault()});
/* ---------- license (Self-Order Kiosk subscription) ---------- */
const isAdminUser=()=>!!ME&&String(ME.role||'').toLowerCase()==='admin';
function renderLock(j){
 j=j||LIC||{};const pr=j.subscriptionPrice;
 $('#lock').innerHTML=`<div class="box" style="max-width:640px;margin:6vh auto;text-align:center"><div style="font-size:3em">🔒</div><h2 style="margin:6px 0">Self-Order Kiosk is not activated</h2>
  <p style="color:var(--m)">${j.hookOutdated?esc(j.message||''):'This store has no active Self-Order Kiosk subscription (or it has expired). The kiosk app and this Counter screen are paused and no new orders are accepted. Your existing orders and settings are kept and come back after activation.'}</p>
  ${pr&&typeof pr.monthly==='number'?`<p><b>Plans:</b> ${peso(pr.monthly).replace('.00','')} / month or ${peso(pr.yearly).replace('.00','')} / year</p>`:''}
  <p>${isAdminUser()?'Open OMNIPOS and click <b>Kiosk Counter</b> (🔒) in the sidebar to see the plans and subscribe.':'Please ask the store owner/admin to activate it in OMNIPOS.'}</p>
  <p><a class="btnlink" href="/" target="_blank" rel="noopener">Open OMNIPOS</a> <button class="g" id="lchk">Check again</button></p><div id="lmsg" style="color:var(--m);min-height:1.4em"></div></div>`;
 $('#lchk').onclick=async()=>{$('#lmsg').textContent='Checking…';await checkLicense();if(LOCKED)$('#lmsg').textContent='Still not activated.'};
}
function showLock(j){LOCKED=true;$('#app').classList.add('locked');$('#grace').classList.add('hide');renderLock(j)}
function hideLock(){if(!LOCKED)return;LOCKED=false;$('#app').classList.remove('locked');lastIds=null;poll();if(tab===2)loadSummary().catch(()=>{});if(tab===3)loadSettings().catch(()=>{})}
function renderGrace(j){
 const g=$('#grace');
 if(j&&j.inGracePeriod){g.textContent='⚠ Your Self-Order Kiosk subscription has expired. It keeps working until '+(j.graceEndsAt?new Date(j.graceEndsAt).toLocaleDateString():'the end of the grace period')+'. Renew it in OMNIPOS to avoid interruption.';g.classList.remove('hide')}
 else if(j&&j.demo){g.textContent='ℹ Demo Mode: the Self-Order Kiosk is unlocked temporarily.';g.classList.remove('hide')}
 else g.classList.add('hide');
}
async function checkLicense(){
 try{const j=await api('GET','/api/kiosk/status');LIC=j;
  if(j&&j.unlocked===true){renderGrace(j);hideLock()}else showLock(j)}
 catch(e){/* offline or already handled (401 / LOCKED) */}
 return LIC;
}
function logout(){TOKEN='';sessionStorage.removeItem('kc_tok');$('#app').classList.add('hide');$('#login').classList.remove('hide')}
$('#lo').onclick=logout;
$('#lb').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const j=await r.json().catch(()=>({}));
 if(j.token){TOKEN=j.token;ME=j.user;sessionStorage.setItem('kc_tok',TOKEN);start()}else $('#lm').textContent=j.message||'Login failed (if the account uses OTP, use a different user).'};
function setVT(){const t=$('#vt');if(t)t.textContent=[L().orders,'Summary','Settings'][tab-1]||''}
function applyLabels(){const l=L();$('#t1 .lb').textContent=l.orders;setVT();lastIds=null;if(tab===1)renderOrders()}
async function loadBiz(){try{const c=await api('GET','/api/kiosk/config');BIZC=(c.config&&c.config.businessType)||'general';applyLabels()}catch(e){/* locked or offline */}}
function show(n){tab=n;setVT();[1,2,3].forEach(i=>{$('#v'+i).classList.toggle('hide',i!==n);$('#t'+i).className=i===n?'on':'g'});if(n===2)loadSummary().catch(()=>{});if(n===3)loadSettings().catch(()=>{})}
[1,2,3].forEach(i=>$('#t'+i).onclick=()=>show(i));
let SND=true;try{SND=localStorage.getItem('kc_snd')!=='0'}catch(e){}
function paintSnd(){const b=$('#snd');if(!b)return;b.innerHTML=`<i class="fa-solid ${SND?'fa-volume-high':'fa-volume-xmark'}"></i>`;b.classList.toggle('off',!SND)}
$('#snd').onclick=()=>{SND=!SND;try{localStorage.setItem('kc_snd',SND?'1':'0')}catch(e){}paintSnd();if(SND)beep()};paintSnd();
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{const b=$('#fs');if(b)b.innerHTML=`<i class="fa-solid ${document.fullscreenElement?'fa-compress':'fa-expand'}"></i>`});
function beep(){if(!SND)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),180)}catch(e){}}
async function poll(){if(!TOKEN||tab!==1||LOCKED)return;try{const j=await api('GET','/api/kiosk/orders?status=open');orders=j.orders||[];const ids=orders.map(o=>o.id+o.status+(o.txId?'$':'')+(o.table||'')+((kitchenProgress(o)||{}).sig?'#'+kitchenProgress(o).sig:'')+(o.allergy||'')).join();
  if(ids!==lastIds){const newer=orders.filter(o=>o.status==='new').length;if(lastIds!==null&&newer>(lastIds.match(/new/g)||[]).length)beep();lastIds=ids;renderOrders()}
  $('#st').textContent='● live';}catch(e){if(!e||e.message!=='LOCKED')$('#st').textContent='offline'}}
let DEVPIN='';
let FILTER='all',QUERY='',seenIds=new Set(),firstPaint=true;
const FDEF=[['all','All'],['unpaid','⏳ Unpaid'],['paid','💳 Paid'],['ready','✅ Ready'],['table','🪑 With table']];
const matchF=(o,f)=>f==='all'||(f==='unpaid'&&!o.txId)||(f==='paid'&&!!o.txId)||(f==='ready'&&o.status==='ready')||(f==='table'&&!!o.table);
function elapsed(o){const m=Math.max(0,Math.floor((Date.now()-Date.parse(o.createdAt))/60000));return {m,txt:m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min',cls:m>=15?'x':m>=8?'w':''}}
function stepper(o){const st=o.status,paid=!!o.txId;const steps=[['New',st==='new'?'c':'d'],[BIZC==='service'?'Ongoing':'Preparing',st==='preparing'?'c':(st==='ready'?'d':'')],['Ready',st==='ready'?'c':''],[paid?'Paid ✔':'Paid',paid?'d':''],['Received','']];return `<div class="stp">${steps.map(x=>`<span class="${x[1]}">${x[0]}</span>`).join('')}</div>`}
function renderOrders(){
 if(BIZC==='service')orders=orders.slice().sort((a,b)=>{const x=apptOf(a),y=apptOf(b);if(x&&y)return x.k<y.k?-1:x.k>y.k?1:0;if(x)return -1;if(y)return 1;return 0});
 const l=L();
 // KPI + chips (computed from all open orders, not the filtered list)
 const nU=orders.filter(o=>!o.txId).length,nP=orders.filter(o=>o.txId).length,nR=orders.filter(o=>o.status==='ready').length,nPR=orders.filter(o=>o.txId&&o.status==='ready').length;
 const nNew=orders.filter(o=>o.status==='new').length,oldM=orders.reduce((m,o)=>Math.max(m,elapsed(o).m),0);
 const nbE=$('#nb');if(nbE){nbE.textContent=nNew;nbE.classList.toggle('hide',!nNew)}document.title=(nNew?'('+nNew+') ':'')+'Kiosk Counter · OMNIPOS';
 $('#kpis').innerHTML=`<div class="kpi"><i class="fa-solid fa-receipt"></i><div><small>Open</small><b>${orders.length}</b></div></div><div class="kpi a"><i class="fa-solid fa-hourglass-half"></i><div><small>Unpaid</small><b>${nU}</b></div></div><div class="kpi p"><i class="fa-solid fa-credit-card"></i><div><small>Paid, not received</small><b>${nP}</b></div></div><div class="kpi r"><i class="fa-solid fa-bag-shopping"></i><div><small>Ready for pickup</small><b>${nPR}</b></div></div><div class="kpi ${oldM>=15?'x':''}"><i class="fa-solid fa-stopwatch"></i><div><small>Longest wait</small><b>${orders.length?oldM+'m':'—'}</b></div></div>`;
 $('#chips').innerHTML=FDEF.map(f=>`<button type="button" class="chip ${FILTER===f[0]?'on':''}" data-f="${f[0]}">${f[1]}<i>${orders.filter(o=>matchF(o,f[0])).length}</i></button>`).join('');

 // Paid + Ready first (ready to hand over), then the longest-waiting orders
 if(BIZC!=='service')list=list.slice().sort((a,b)=>((b.txId&&b.status==='ready')?1:0)-((a.txId&&a.status==='ready')?1:0)||Date.parse(a.createdAt)-Date.parse(b.createdAt));
 $('#cards').innerHTML=list.length?list.map(o=>{const e=elapsed(o);return `<div class="o ${o.status}${o.txId?' paid':''}${e.cls==='x'&&o.status!=='ready'?' late':''}${CLOSING.has(o.id)?' closing':''}${!firstPaint&&!seenIds.has(o.id)?' pulse':''}" data-oid="${esc(o.id)}"><h3><span class="no">#${esc(o.orderNo)}</span><span>${peso(o.total)}</span></h3>

  ${orderAllergy(o)?`<div class="alg">⚠️ Allergy / special request: <b>${esc(orderAllergy(o))}</b></div>`:''}
  <small style="display:block;margin-top:6px">${esc(o.orderType)}${o.customerName?' · '+esc(o.customerName):''}${o.phone?' · '+esc(o.phone):''} · ${new Date(o.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · <b>${esc(o.status)}</b>${o.txId?' · <span title="POS transaction">'+esc(o.txId)+'</span>':''}</small>
  ${o.txId&&o.status!=='ready'?`<div class="pw">💳 Already paid — ${o.status==='new'?'not started yet':'still being prepared'}. Press Ready when it is done.</div>`:''}
  ${stepper(o)}
  ${apptOf(o)?`<div style="margin:6px 0;font-weight:700;color:var(--warnt)">📅 ${esc(apptLabel(apptOf(o)))}</div>`:''}
  <ul>${o.items.map(i=>`<li><b>${i.qty}×</b> ${esc(i.name)}${i.unit?' ('+esc(i.unit)+')':''}${i.options.length?' <small>['+esc(i.options.map(x=>x.name).join(', '))+']</small>':''}${i.note?' <small>📝 '+esc(i.note)+'</small>':''}</li>`).join('')}</ul>

  <div class="acts">${o.status==='new'?`<button data-a="preparing" data-id="${o.id}">${l.prep}</button>`:''}${o.status!=='ready'?`<button class="k" data-a="ready" data-id="${o.id}">${l.ready}</button>`:''}
  ${o.txId?`<button class="${o.status==='ready'?'k':'g'}" data-a="done" data-recv="1" data-id="${o.id}" ${o.status==='ready'?'':'style="opacity:.65"'}>${l.recv}</button>`:`<button class="g" data-a="done" data-id="${o.id}">${l.done}</button><span class="sp"></span><button class="r" data-a="cancelled" data-id="${o.id}">✖</button>`}</div></div>`}).join(''):`<div class="empty">${orders.length?'No orders match the filter/search.':l.empty}</div>`;
 if(orders.length){orders.forEach(o=>seenIds.add(o.id));firstPaint=false}

const BUSY=new Set(),CLOSING=new Map();
function askConfirm(o){return new Promise(res=>{const m=document.createElement('div');m.className='mdl';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
 m.innerHTML=`<div class="bx"><h3>${o.title}</h3><div class="sm">${o.sum||''}</div>${(o.warns||[]).map(w=>`<div class="wn">⚠ ${w}</div>`).join('')}<div class="bt"><button type="button" class="g" id="mc">No / Go back</button><button type="button" class="${o.danger?'r':'k'}" id="mo">${o.ok}</button></div></div>`;
 document.body.appendChild(m);const done=v=>{document.removeEventListener('keydown',kd,true);m.remove();res(v)};
 const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(false)}};document.addEventListener('keydown',kd,true);
 m.querySelector('#mc').onclick=()=>done(false);m.querySelector('#mo').onclick=()=>done(true);m.onclick=e=>{if(e.target===m)done(false)};
 m.querySelector('#mc').focus()})} // "No / Go back" is focused so an accidental Enter cannot trigger the risky action
function toast(msg,ms,undo){const box=$('#toasts'),t=document.createElement('div');t.className='tst';t.innerHTML=`<span>${msg}</span>${undo?'<button type="button">↩ Undo</button>':''}<i class="bar" style="animation-duration:${ms}ms"></i>`;box.appendChild(t);
 let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(tm);t.remove()};const tm=setTimeout(()=>{end();if(undo&&undo.expire)undo.expire()},ms);
 if(undo)t.querySelector('button').onclick=()=>{end();undo.run()};return end}
const sumHtml=o=>`<b>#${esc(o.orderNo)}</b> · ${peso(o.total)}${o.table?' · 🪑 Table '+esc(o.table):''}${o.customerName?' · '+esc(o.customerName):''}<br><small>${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</small><br>${o.txId?'💳 Paid':'⏳ Not paid yet'} · ${esc(o.status)}`;
async function send(id,body){const r=await api('POST','/api/kiosk/orders/'+id+'/status',body);if(r&&r.success===false){toast('✗ '+esc(r.message||'The order could not be updated.'),r.stale?7000:5000);}lastIds=null;poll();return r}
async function act(b){
 const id=b.dataset.id,a=b.dataset.a,recv=!!b.dataset.recv,oo=orders.find(x=>x.id===id);
 if(!oo||BUSY.has(id)||CLOSING.has(id))return;      // double-tap guard
 BUSY.add(id);b.disabled=true;
 try{
  const prev=oo.status;
  if(a==='preparing'||a==='ready'){                    // easy to reverse: runs immediately, with Undo
   const r=await send(id,{status:a,expectedStatus:prev});
   if(r&&r.success!==false)toast(`#${esc(oo.orderNo)} → <b>${a}</b>`,6000,{run:()=>send(id,{status:prev,expectedStatus:a})});
   return}
  // Closing actions (Received / Paid-Done / Cancel): confirm AND a 6s Undo before it is really sent
  const warns=[];let title,ok,danger=false,body;
  if(a==='cancelled'){title='Cancel this order?';ok='Yes, cancel';danger=true;body={status:'cancelled',expectedStatus:prev};if(oo.items.length)warns.push('This cannot be undone.')}
  else if(recv){title='Has the customer received the order?';ok='📦 Yes, Received';body={status:'done',received:true,expectedStatus:prev};if(prev!=='ready')warns.push('The order is not Ready yet (status: '+esc(prev)+'). Make sure it is ready before handing it over.')}
  else{title='Close this order?';ok='Yes, Paid / Done';body={status:'done',expectedStatus:prev};if(!oo.txId)warns.push('This has not been scanned/paid in the POS, so no stock will be deducted and no receipt will be issued.')}
  if(!await askConfirm({title,ok,danger,sum:sumHtml(oo),warns}))return;
  CLOSING.set(id,1);renderOrders();
  toast(`#${esc(oo.orderNo)} will be removed from the counter…`,6000,{run:()=>{CLOSING.delete(id);renderOrders()},expire:async()=>{await send(id,body);CLOSING.delete(id);renderOrders()}});
 }finally{BUSY.delete(id);b.disabled=false}
}
